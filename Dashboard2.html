<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        #main{
            height: 90vh;
            width: 80vw;
            border: 3px solid rgb(0, 0, 0);
            box-shadow: 5px 5px 10px rgb(0, 0, 0);
            margin-left: 100px;
            margin-top: 40px;
            display: flex;
            position: relative;
        }

        #side{
            height: 100%;
            width: 18%;
            border: 3px solid rgb(0, 0, 0);
        }

        #nav{
            height: 18%;
            width: 80%;
            border: 3px solid rgb(0, 0, 0);
            position: absolute;
            left: 20%;
        }

        .container{
            height: 38%;
            width: 80%;
            border: 3px solid rgb(0, 0, 0);
            position: absolute;
            left: 20%;
            top: 22%;
        }

        .cards{
            display: flex;
            flex-direction: row;
            height: 100%;
            gap: 10px;
            margin: 8px;
        }

        #bx1{
            width: 33%;
            height: 90%;
            background-color: red;
            border: 3px solid rgb(0, 0, 0);
            border-radius: 10px;
        }

        #bx2{
            width: 33%;
            height: 90%;
            background-color: red;
            border: 3px solid rgb(0, 0, 0);
            border-radius: 10px;
        }

        #bx3{
            width: 33%;
            height: 90%;
            background-color: red;
            border: 3px solid rgb(0, 0, 0);
            border-radius: 10px;
        }
        #card2{
            height: 34%;
            width: 80%;
            border: 3px solid rgb(0, 0, 0);
            position: absolute;
            left: 20%;
            top: 62%;
        }

    </style>
</head>

<body>

    <div id="main">

        <div id="side">
        </div>

        <div id="nav">
        </div>

        <div class="container">
            <div class="cards">
                <div id="bx1"></div>
                <div id="bx2"></div>
                <div id="bx3"></div>
            </div>
        </div>
        <div id="card2">

        </div>

    </div>

</body>
</html>
