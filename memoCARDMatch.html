
<!DOCTYPE html>
<html>
<head>
    <title>Memory Card Match</title>
    <style>
        .grid {
            display: grid;
            grid-template-columns: repeat(4, 70px);
            gap: 10px;
        }

        button {
            height: 70px;
            font-size: 25px;
        }
    </style>
</head>
<body>

    <h2>Memory Card Match</h2>
    <h3>Moves: <span id="moves">0</span></h3>

    <div class="grid" id="grid"></div>

    <script>
        let arr = ["🍎", "🍌", "🍇", "🍊",
                   "🍎", "🍌", "🍇", "🍊",
                   "🍓", "🥝", "🍒", "🍍",
                   "🍓", "🥝", "🍒", "🍍"];

        arr.sort(() => Math.random() - 0.5);

        let first = null;
        let second = null;
        let moves = 0;
        let lock = false;

        let grid = document.getElementById("grid");

        arr.forEach(function(item) {
            let btn = document.createElement("button");
            btn.innerText = "?";
            grid.appendChild(btn);

            btn.onclick = function() {
                if (lock || btn.innerText !== "?") return;

                btn.innerText = item;

                if (first === null) {
                    first = btn;
                } else {
                    second = btn;
                    moves++;
                    document.getElementById("moves").innerText = moves;

                    if (first.innerText === second.innerText) {
                        first = null;
                        second = null;
                    } else {
                        lock = true;

                        setTimeout(function() {
                            first.innerText = "?";
                            second.innerText = "?";
                            first = null;
                            second = null;
                            lock = false;
                        }, 1000);
                    }
                }
            };
        });
    </script>

</body>
</html>
