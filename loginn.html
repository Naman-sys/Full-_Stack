<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox Login Page</title>
    <style>
        .login{
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }  
        ul{
            display: flex;
            column-gap: 10%;
            flex:1;
            list-style-type: none;
            margin: 0;
            padding: 0;
        } 
        .logo{
            flex:1;
        } 
    </style>
</head>
<body>
    <div id="nav">
        
            <div class="logo">LOGO</div>
            <ul>
                <li>Home</li>
                <li>About</li>
                <li>Contac</li>
            </ul>
        
    </div>
    <div class="login">
        <h2>Login</h2>
        <input type="text" placeholder="Enter Username">
        <br>
        <input type="password" placeholder="Enter Password">
        <br><br>
        <button>Login</button>
        <p>Don't have an account? <a href="#">Register</a></p>
    </div>
    

</body>
</html>
