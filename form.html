<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        input {
            border-width:0px 0px 3px 0px;
            border-color: black;
            margin-top: 3%;
            font-size:25px;
        }
        input:required{
            border-color: red;
        }
        input:optional{
            border-color: rgb(0, 124, 128);
        }
        input:enabled{
            background-color: aliceblue;
        }
        input:disabled{
            background-color: rgb(119, 114, 114);
        }
        input:valid{
            border-color: green;
        }
        button{
            height: 50px;
            width: 100px;
            font-size: 20px;
        }
        button:hover{
            background-color: black;
            color: aliceblue;
        }
        body{
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #div1{
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        div:has(h1){
            background-color: rgb(0, 124, 128);
            padding: 20px;
            border-radius: 10px;
        }
        li:not(:hover){
            color: aliceblue;
        }


    </style>
</head>
<body>
    <div id="div1">
        <h1>Form</h1>
        <input type="text" placeholder="First name"required><br>
        <input type="text" placeholder="Middle name"optional><br>
        <input type="text" placeholder="Last name"required><br>
        <input type="text" placeholder="Mathura"disabled><br>
        <input type="email" placeholder="Enter mail"required><br><br>
        <button>Submit</button>
    </div>
    <br>
    <div>
        <ul>
            <li>1</li>
            <li>2</li>
            <li>3</li>
            <li>4</li>
            <li>5</li>
        </ul>
    </div>


</body>
</html>
