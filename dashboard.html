<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard</title>
    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f5f5f5;
        color: #333;
      }

      .page {
        display: flex;
        min-height: 100vh;
      }

      .sidebar {
        width: 200px;
        background: #222;
        color: white;
        padding: 20px;
      }

      .sidebar h2 {
        margin-top: 0;
        font-size: 22px;
      }

      .sidebar a {
        display: block;
        color: white;
        text-decoration: none;
        margin: 10px 0;
      }

      .main {
        flex: 1;
        padding: 20px;
      }

      .top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
      }

      .box {
        background: white;
        border: 1px solid #ddd;
        padding: 15px;
        margin-bottom: 15px;
        border-radius: 8px;
      }

      .cards {
        display: flex;
        gap: 15px;
        flex-wrap: wrap;
      }

      .card {
        background: #eef6ff;
        padding: 15px;
        border-radius: 8px;
        width: 180px;
      }

      .card h3 {
        margin: 0 0 8px 0;
        font-size: 16px;
      }

      .card p {
        margin: 0;
        font-size: 20px;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <div class="page">
      <aside class="sidebar">
        <h2>My Dash</h2>
        <a href="#">Home</a>
        <a href="#">Reports</a>
        <a href="#">Users</a>
        <a href="#">Settings</a>
      </aside>

      <main class="main">
        <div class="top">
          <div>
            <h1>Welcome</h1>
            <p>This is your simple dashboard.</p>
          </div>
          <button>Click Me</button>
        </div>

        <div class="cards">
          <div class="card">
            <h3>Sales</h3>
            <p>$500</p>
          </div>
          <div class="card">
            <h3>Orders</h3>
            <p>20</p>
          </div>
          <div class="card">
            <h3>Users</h3>
            <p>100</p>
          </div>
        </div>

        <div class="box">
          <h3>Recent Activity</h3>
          <p>New order received.</p>
          <p>Client message sent.</p>
        </div>
      </main>
    </div>
  </body>
</html>
