<!DOCTYPE html>
<html>
  <head>
    <title>Hello, World!</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <h1 id="q"></h1>
    <div id="o"></div>
    <br />
    <button onclick="next()">Next</button>

      <script>
        const questions =[
          {
            question: "What is JavaScript?",
            options: [
                "Programming Language",
                "Database",
                "Operating System",
                "Browser"
            ],
            answer: "Programming Language"
          },
          {
            question: "Which keyword declares a constant?",
            options: ["var", "let", "const", "static"],
            answer: "const"
          },
          {
            question: "Which method adds an element at the end?",
            options: ["pop()", "push()", "shift()", "slice()"],
            answer: "push()"
          }
        ];
        let q=0;
        function start(){
          document.getElementById("q").textContent=questions[q].question;
          document.getElementById("o").innerHTML="";
          questions[q].options.forEach(option=>{
            let btn=document.createElement("button");
            btn.textContent=option;
            document.getElementById("o").appendChild(btn);
            document.getElementById("o").appendChild(
              document.createElement("br")
            );
            
          })
          

        }
        function next(){
          q++;
          if(q<questions.length){
            start();
          }
          else {
                document.getElementById("q").textContent = "Quiz Completed!";
                document.getElementById("o").innerHTML = "";
            }


        }
        start();


      </script>
  </body>
</html>
